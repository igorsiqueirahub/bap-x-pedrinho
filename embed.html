<!-- A briga Bap x Pedrinho na Justiça: embed para a matéria (fios acima e abaixo, 8px de espaço depois do texto) -->
<!-- Página inteira, sem barra de rolagem e sem script: a altura do iframe é calculada pela largura da tela.
     Celular (tela até 512px): 28,8 x a largura da coluna (tela - 32px) + 16px. Desktop e tablet: 7540px. -->
<div class="bap-x-pedrinho-embed" style="margin-top:8px;margin-right:0;margin-bottom:8px;margin-left:0;border-top:1px solid #E6E6E6;border-bottom:1px solid #E6E6E6">
  <iframe src="https://igorsiqueirahub.github.io/bap-x-pedrinho/" title="A briga Bap x Pedrinho na Justiça" loading="lazy" scrolling="no"
    width="100%" height="7540" style="display:block;width:100%;height:max(7540px, min(calc((100vw - 32px) * 28.8 + 16px), calc((513px - 100vw) * 100000)));border:0;overflow:hidden"></iframe>
</div>
